<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ЛР 03 — сеанс</title>
</head>
<body>
  <h1>Навчальний сеанс</h1>
  <p id="state" role="status">Стан: перевірка…</p>

  <section id="anon-section">
    <h2>Реєстрація</h2>
    <form id="register">
      <label>Ім'я користувача <input name="userName" autocomplete="username" required></label>
      <label>Email <input name="email" type="email" autocomplete="email" required></label>
      <label>Відображуване ім'я <input name="displayName" required></label>
      <label>Пароль <input name="password" type="password" autocomplete="new-password" required></label>
      <button>Зареєструватися</button>
    </form>
    <h2>Вхід</h2>
    <form id="login">
      <label>Ім'я <input name="userName" autocomplete="username" required></label>
      <label>Пароль <input name="password" type="password" autocomplete="current-password" required></label>
      <button>Увійти</button>
    </form>
  </section>

  <section id="session-section" hidden>
    <h2>Профіль</h2>
    <button id="me" type="button">Оновити профіль</button>
    <button id="logout" type="button">Вийти</button>
    <dl>
      <dt>Id</dt><dd id="p-id"></dd>
      <dt>Ім'я</dt><dd id="p-name"></dd>
      <dt>Ролі</dt><dd id="p-roles"></dd>
    </dl>
    <h2>Новий інцидент</h2>
    <form id="incident">
      <label>Title <input name="title" required maxlength="160"></label>
      <label>Description <textarea name="description" required maxlength="4000"></textarea></label>
      <label>Severity
        <select name="severity"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select>
      </label>
      <label>Occurred <input name="occurredAt" type="datetime-local" required></label>
      <button>Створити</button>
    </form>
  </section>

  <pre id="result"></pre>
  <script type="module" src="auth-lab.js"></script>
</body>
</html>
